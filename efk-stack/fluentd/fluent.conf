<source>
  @type tail
  path /esdata/login.log
  pos_file /fluentd/log/login.log.pos
  tag login
  format none
</source>


<filter login>
  @type record_transformer
  enable_ruby true
</filter>

<match login>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix fluentd
  logstash_dateformat %Y%m%d
  include_tag_key true
  tag_key @log_name
  <buffer>
    flush_interval 1s
  </buffer>
</match>
